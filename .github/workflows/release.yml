name: Release Shadowrocket Rules

on:
  schedule:
    # 每日8时开始
    - cron:  '0 23 * * *'
  
  push:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
      
  pull_request_target:
    branches:
      - build
    paths-ignore: 
      - '**.md'
      - 'LICENSE'
  
  workflow_dispatch:
  
jobs:
  Release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build
          path: build
      
      - uses: actions/checkout@v4
        with:
          ref: release
          path: release
      
      - name: Install requirements
        run: pip3 install -r build/requirements.txt
      
      - name: Build Rules
        run: |
          cd build || exit 1
          ./factory/auto_build.sh
      
      - name: Move files
        run: |
          cd build || exit 1
          cp *.conf ../release/
          cp -r figure ../release/
          cp LICENSE ../release/
          cp readme.md ../release/
      
      - name: Update lazy rules
        run: |
          cd release || exit 1
          rm lazy.conf lazy_group.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf
          curl -O https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy_group.conf
          sed -i 's/^FINAL,PROXY/FINAL,DIRECT/' lazy_group.conf
          sed -i '/^\[General\]/a update-url = https://raw.githubusercontent.com/blairevan/Shadowrocket-ADBlock-Rules-Forever/release/lazy_group.conf' lazy_group.conf
          sed -i 's|rule/QuantumultX/|rule/Shadowrocket/|g' lazy.conf lazy_group.conf
          sed -i '/rule\/Shadowrocket\/GitHub\/GitHub.list/a DOMAIN-SUFFIX,notion.com,PROXY\nDOMAIN-SUFFIX,notion.so,PROXY\nDOMAIN-SUFFIX,notion.site,PROXY\nDOMAIN-SUFFIX,via.placeholder.com,PROXY\nDOMAIN-SUFFIX,cftunnel.com,PROXY\nDOMAIN-SUFFIX,tavily.com,PROXY' lazy.conf lazy_group.conf
          sed -i '/rule\/Shadowrocket\/Telegram\/Telegram.list,TELEGRAM/a IP-CIDR,194.221.250.50/32,TELEGRAM,no-resolve\nIP-CIDR,149.154.167.91/32,TELEGRAM,no-resolve' lazy_group.conf
          sed -i '/rule\/Shadowrocket\/Telegram\/Telegram.list,PROXY/a IP-CIDR,194.221.250.50/32,PROXY,no-resolve\nIP-CIDR,149.154.167.91/32,PROXY,no-resolve' lazy.conf
          sed -i '/rule\/Shadowrocket\/Apple\/Apple.list,苹果服务/s DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,苹果服务' lazy_group.conf
          sed -i '/rule\/Shadowrocket\/Apple\/Apple.list,DIRECT/s DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT' lazy.conf
          sed -i '/rule\/Shadowrocket\/Global\/Global.list/s DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global_Domain.list,PROXY' lazy.conf lazy_group.conf
          sed -i '/rule\/Shadowrocket\/China\/China.list/s DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list,DIRECT' lazy.conf lazy_group.conf
        
      - name: Remove commits
        run: |
          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan latest_branch
          git add -A
          git commit -am "Nightly build"
          git branch -D release
          git branch -m release
          git push -f origin release

